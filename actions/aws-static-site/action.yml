name: AWS static site deploy
description: >-
  Optionally build a static site, then sync it to S3 and invalidate CloudFront,
  authenticating to AWS keylessly via GitHub OIDC. Give it the client name +
  AWS account id and it works out the role, bucket and distribution itself — no
  repo Variables needed.

# Caller requirements:
#   permissions:
#     id-token: write   # mint the OIDC token configure-aws-credentials exchanges
#     contents: read
#
# Two ways to call it:
#   client-name + aws-account-id   (preferred) — derives <name>-github-deploy,
#       <name>-site-<account>, and looks up the distribution serving that bucket.
#   role-arn + s3-bucket + cloudfront-distribution-id   (older repos) — explicit.
# Either way the deploy role (from aws-grant-access) must trust the calling repo.

inputs:
  client-name:
    description: Client name (clients/<name>.yaml in website-deploy). Use with aws-account-id.
    required: false
    default: ""
  aws-account-id:
    description: The client's 12-digit AWS account id. Use with client-name.
    required: false
    default: ""
  aws-region:
    description: AWS region of the S3 bucket.
    required: false
    default: us-west-2
  role-arn:
    description: (older repos) ARN of the deploy role to assume via OIDC.
    required: false
    default: ""
  s3-bucket:
    description: (older repos) Name of the destination S3 bucket.
    required: false
    default: ""
  cloudfront-distribution-id:
    description: (older repos) CloudFront distribution ID to invalidate after sync.
    required: false
    default: ""
  source-dir:
    description: Directory whose contents are synced to the bucket (e.g. site, dist).
    required: true
  build-command:
    description: Optional build command (e.g. "npm run build"). Skipped if empty.
    required: false
    default: ""
  install-command:
    description: Optional dependency install command (e.g. "npm ci"). Skipped if empty.
    required: false
    default: ""
  node-version:
    description: Node version used when a build/install command is set.
    required: false
    default: "20"
  working-directory:
    description: Directory to run install/build from (source-dir is resolved from here).
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up Node
      # Only needed when the caller asks us to build or install.
      if: inputs.build-command != '' || inputs.install-command != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      if: inputs.install-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.install-command }}

    - name: Build
      if: inputs.build-command != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}

    - name: Resolve deploy target
      id: target
      shell: bash
      env:
        NAME: ${{ inputs.client-name }}
        ACCOUNT: ${{ inputs.aws-account-id }}
        ROLE: ${{ inputs.role-arn }}
        BUCKET: ${{ inputs.s3-bucket }}
        DIST: ${{ inputs.cloudfront-distribution-id }}
      run: |
        if [ -n "$NAME" ]; then
          echo "$ACCOUNT" | grep -qE '^[0-9]{12}$' || { echo "::error::aws-account-id must be the 12-digit account id (quote it in YAML)"; exit 1; }
          ROLE="arn:aws:iam::${ACCOUNT}:role/${NAME}-github-deploy"
          BUCKET="${NAME}-site-${ACCOUNT}"
        elif [ -z "$ROLE" ] || [ -z "$BUCKET" ] || [ -z "$DIST" ]; then
          echo "::error::Pass client-name + aws-account-id (or, for older repos, role-arn + s3-bucket + cloudfront-distribution-id)."
          exit 1
        fi
        {
          echo "role=$ROLE"
          echo "bucket=$BUCKET"
          echo "dist=$DIST"
        } >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ steps.target.outputs.role }}
        aws-region: ${{ inputs.aws-region }}

    - name: Find the CloudFront distribution
      id: dist
      shell: bash
      env:
        BUCKET: ${{ steps.target.outputs.bucket }}
        DIST: ${{ steps.target.outputs.dist }}
      run: |
        if [ -z "$DIST" ]; then
          # The one distribution whose origin is this site's bucket.
          DIST="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?starts_with(DomainName, '${BUCKET}.s3.')]].Id" \
            --output text | tr -s '[:space:]' ' ' | sed 's/^ *//; s/ *$//')"
          case "$DIST" in
            "" | None) echo "::error::No CloudFront distribution serves ${BUCKET} — has this client been provisioned?"; exit 1 ;;
            *" "*) echo "::error::More than one distribution serves ${BUCKET}: ${DIST}"; exit 1 ;;
          esac
        fi
        echo "Deploying to s3://${BUCKET} via CloudFront ${DIST}"
        echo "id=$DIST" >> "$GITHUB_OUTPUT"

    - name: Sync to S3
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Long-cache the fingerprinted assets, but never cache the HTML so
        # updates show up immediately (CloudFront invalidation handles the rest).
        aws s3 sync "${{ inputs.source-dir }}" "s3://${{ steps.target.outputs.bucket }}" \
          --delete \
          --exclude "*.html" \
          --cache-control "public,max-age=31536000,immutable"

        aws s3 sync "${{ inputs.source-dir }}" "s3://${{ steps.target.outputs.bucket }}" \
          --delete \
          --exclude "*" --include "*.html" \
          --cache-control "no-cache"

    - name: Invalidate CloudFront cache
      shell: bash
      run: |
        aws cloudfront create-invalidation \
          --distribution-id "${{ steps.dist.outputs.id }}" \
          --paths "/*"
