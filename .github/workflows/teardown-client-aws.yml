name: Teardown Client's AWS Setup

# DANGER: permanently destroys a client's site infrastructure (S3 + CloudFront +
# any DNS/ACM). Use to spin a site down between tests so it stops billing.
#
# Guardrails: manual only, owner-only, you must retype the env name to confirm,
# and it runs in the client's GitHub Environment (which also waits for an
# approval if the environment has required reviewers). It destroys ONLY the site — the access config (OIDC provider +
# deploy/Terraform roles + state backend) is a separate state and is left intact,
# so you can re-provision the site again later with a plain Terraform dispatch.
on:
  workflow_call:
    inputs:
      package_ref:
        description: website-deploy ref to run (the same tag/sha as in your `uses:` line).
        type: string
        required: true
      client:
        description: Client to DESTROY (one at a time — no "all").
        type: string
        required: true
      confirm:
        description: Retype the client name to confirm destruction.
        type: string
        required: true

permissions:
  id-token: write # OIDC token to assume the AWS role
  contents: read

# Called from the private clients repo (workflow_call) — it isn't run here. Its
# clients/ is checked out at the workspace root, this package at package_ref
# into pkg/.
env:
  CLIENTS_DIR: ${{ github.workspace }}/clients
  # One Terraform version everywhere — keep in sync with .terraform-version (the
  # validate job checks). State written by a newer Terraform can't be read by an
  # older one, so never let CI drift ahead of your laptop.
  TERRAFORM_VERSION: "1.16.5"

defaults:
  run:
    working-directory: pkg

concurrency:
  group: terraform # shared with Provision + Unlock (all branches): never two Terraform runs at once
  cancel-in-progress: false

jobs:
  # Fail fast on a typo'd/invalid client BEFORE any job names it as an
  # environment (GitHub would silently create an unprotected one).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # client files: clients/ in the calling repo
        with:
          sparse-checkout: clients
      - uses: actions/checkout@v4 # the package, at the caller's pinned ref
        with:
          repository: derekadombek/website-deploy
          ref: ${{ inputs.package_ref }}
          path: pkg
      - name: Check client file
        env:
          CLIENT: ${{ inputs.client }}
        run: source infra/scripts/lib/client.sh && client_check "$CLIENT"

  destroy:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ inputs.client }} # scoped AWS_TF_ROLE_ARN/AWS_REGION (+ approval, if it has reviewers)
    steps:
      - name: Guard — owner + confirmation
        working-directory: . # before checkout: pkg/ isn't there yet
        env:
          CLIENT: ${{ inputs.client }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${{ github.actor }}" != "derekadombek" ]; then
            echo "::error::Only the repo owner may run this workflow (actor: ${{ github.actor }})."; exit 1
          fi
          if [ "$CONFIRM" != "$CLIENT" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match client '$CLIENT'. Aborting."; exit 1
          fi

      - uses: actions/checkout@v4 # client files: clients/ in the calling repo
        with:
          sparse-checkout: clients
      - uses: actions/checkout@v4 # the package, at the caller's pinned ref
        with:
          repository: derekadombek/website-deploy
          ref: ${{ inputs.package_ref }}
          path: pkg
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # Subdomain delegated from another client's zone → remove that NS record
      # first, so the parent zone isn't left pointing at a deleted zone.
      - name: Read client file
        id: client
        env:
          CLIENT: ${{ inputs.client }}
        run: |
          source infra/scripts/lib/client.sh
          echo "delegation_role=$(client_delegation_role_arn "$CLIENT")" >> "$GITHUB_OUTPUT"
      - name: Switch to the parent zone's delegation role
        if: steps.client.outputs.delegation_role != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.client.outputs.delegation_role }}
          aws-region: us-east-1
      - name: Remove NS record from the parent zone
        if: steps.client.outputs.delegation_role != ''
        env:
          CLIENT: ${{ inputs.client }}
        run: infra/scripts/delegate-ns.sh delete "$CLIENT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Destroy
        env:
          CLIENT: ${{ inputs.client }}
        run: infra/scripts/tf.sh "$CLIENT" destroy -auto-approve -input=false
