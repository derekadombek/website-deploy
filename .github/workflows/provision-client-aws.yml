name: Provision Client's AWS Setup

# Brings every client's (or one chosen client's) AWS setup in line with its
# client file. Inputs: `client` (default "all") and `apply` (default false):
#
#   validate → plan (every client, read-only)
#            → apply (only with apply: true, only clients whose plan shows changes)
#
# Plan only is the default, so a run never changes anything you haven't read:
# read the plans in the run summary, then run again with apply ticked.
#
# The plan runs on each client's read-only <name>-plan role, which trusts the
# clients repo's main branch — so run it from main. The apply runs on each
# client's Terraform role, which only a job in that client's GitHub Environment
# can get. If the environment has required reviewers (only some GitHub plans
# allow them on a private repo), the applies also wait for that approval.
#
# A client is CI-managed iff a GitHub Environment with its name exists (Set CI
# Environment creates it). Validate-only clients (ci: false) are only checked.
#
# DNS is handled from the client file — one workflow for every case:
#   - no domain / existing zone / route53-registrar → straight apply.
#   - dns: external + delegate_from: <parent> → creates the zone, writes the NS
#     record into the parent client's zone (via its <parent>-dns-delegation
#     role), then applies. Hands-off.
#   - dns: external, domain at an outside registrar → creates the zone, prints
#     the 4 nameservers in the run summary, and WAITS (up to 1h) while you paste
#     them at the registrar; then applies.
#   - delegate_from removed or changed → first deletes the NS record from the
#     old parent zone (the client's state remembers where it was).
on:
  workflow_call:
    inputs:
      package_ref:
        description: website-deploy ref to run (the same tag/sha as in your `uses:` line).
        type: string
        required: true
      apply:
        description: Apply the clients whose plan shows changes (none = nothing to apply). False = plan only.
        type: boolean
        default: false
      client:
        description: One client to plan/apply, or "all".
        type: string
        default: all

permissions:
  id-token: write # OIDC token to assume the AWS roles
  contents: read
  actions: read # list the repo's environments (needed when the repo is private)

# Called from the private clients repo (workflow_call) — it isn't run here. Its
# clients/ is checked out at the workspace root, this package at package_ref
# into pkg/.
env:
  CLIENTS_DIR: ${{ github.workspace }}/clients
  # One Terraform version everywhere — keep in sync with .terraform-version (the
  # validate job checks). State written by a newer Terraform can't be read by an
  # older one, so never let CI drift ahead of your laptop.
  TERRAFORM_VERSION: "1.16.5"

defaults:
  run:
    working-directory: pkg

# One Terraform run at a time across ALL branches (shared with Teardown and
# Unlock), so two runs can never hold the same client's state.
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      all_matrix: ${{ steps.scope.outputs.all_matrix }}
      ci_matrix: ${{ steps.scope.outputs.ci_matrix }}
      has_ci: ${{ steps.scope.outputs.has_ci }}
    steps:
      - name: Run from main
        working-directory: . # before checkout: pkg/ isn't there yet
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Provision from main — the read-only plan roles only trust main."
          exit 1
      - uses: actions/checkout@v4 # the calling repo: clients/ + its workflows (dropdowns)
        with:
          sparse-checkout: |
            clients
            .github/workflows
      - uses: actions/checkout@v4 # the package, at the caller's pinned ref
        with:
          repository: derekadombek/website-deploy
          ref: ${{ inputs.package_ref }}
          path: pkg
      - name: List clients
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_INPUT: ${{ inputs.client }}
        run: |
          set -euo pipefail
          source infra/scripts/lib/client.sh
          client_dropdowns_check "${GITHUB_WORKSPACE}/.github/workflows"
          all=$(client_list aws)
          if [ "${CLIENT_INPUT:-all}" != "all" ]; then
            client_check "$CLIENT_INPUT"
            all="$CLIENT_INPUT"
          fi
          # CI-managed = has a GitHub Environment of the same name.
          envs=$(gh api "repos/${GITHUB_REPOSITORY}/environments" --paginate --jq '.environments[].name')
          ci=$(for c in $all; do echo "$envs" | grep -qx "$c" && echo "$c" || true; done)

          m() { printf '%s\n' $1 | jq -R . | jq -cs '{include: map(select(length>0) | {env: .})}'; }
          {
            echo "all_matrix=$(m "$all")"
            echo "ci_matrix=$(m "$ci")"
            echo "has_ci=$([ -n "$ci" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "clients: $(echo $all)"; echo "CI-managed: $(echo $ci)"

  # Credential-free checks for every client.
  validate:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.all_matrix) }}
    steps:
      - uses: actions/checkout@v4 # the calling repo: clients/ + its workflows (dropdowns)
        with:
          sparse-checkout: |
            clients
            .github/workflows
      - uses: actions/checkout@v4 # the package, at the caller's pinned ref
        with:
          repository: derekadombek/website-deploy
          ref: ${{ inputs.package_ref }}
          path: pkg
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Terraform version matches .terraform-version
        run: |
          want="$(cat .terraform-version)"; have="$(terraform version -json | jq -r .terraform_version)"
          [ "$want" = "$have" ] || { echo "::error::workflow pins $have but .terraform-version says $want — keep them in sync"; exit 1; }
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Check client file + validate
        run: |
          source infra/scripts/lib/client.sh
          client_tf_init "${{ matrix.env }}" -backend=false
          terraform validate

  # Read-only plan for every CI-managed client — no approval. Records which
  # clients have changes; only those go on to apply.
  plan:
    needs: [setup, validate]
    if: needs.setup.outputs.has_ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.ci_matrix) }}
    env:
      CLIENT: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4 # the calling repo: clients/ + its workflows (dropdowns)
        with:
          sparse-checkout: |
            clients
            .github/workflows
      - uses: actions/checkout@v4 # the package, at the caller's pinned ref
        with:
          repository: derekadombek/website-deploy
          ref: ${{ inputs.package_ref }}
          path: pkg
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Read client file
        id: client
        run: |
          source infra/scripts/lib/client.sh
          echo "plan_role=$(client_plan_role_arn "$CLIENT")" >> "$GITHUB_OUTPUT"
          echo "region=$(client_get "$CLIENT" region)" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials (read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.client.outputs.plan_role }}
          aws-region: ${{ steps.client.outputs.region }}
      - name: Plan
        run: |
          set +e
          infra/scripts/tf.sh "$CLIENT" plan -no-color -input=false -detailed-exitcode > plan.txt 2>&1
          rc=$?
          set -e
          cat plan.txt
          case $rc in
            0) summary="no changes" ;;
            2) summary="**has changes — needs approval**"; mkdir -p changes; touch "changes/$CLIENT" ;;
            *) echo "::error::plan failed for $CLIENT"; exit $rc ;;
          esac
          {
            echo "### $CLIENT — $summary"
            echo '<details><summary>plan</summary>'; echo; echo '```'
            grep -E '^\s*[#~+-]|^Plan:|No changes' plan.txt | head -200 || true
            echo '```'; echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mark client as changed
        if: hashFiles('pkg/changes/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: changes-${{ matrix.env }}
          path: pkg/changes/
          retention-days: 1

  # Which clients need an apply.
  # Runs even if some plans failed, so the clients that planned fine still apply.
  changes:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      has_changes: ${{ steps.collect.outputs.has_changes }}
    defaults:
      run:
        working-directory: . # no checkout in this job
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: changes-*
          merge-multiple: true
          path: changes
      - name: Collect
        id: collect
        run: |
          changed=$(ls changes 2>/dev/null || true)
          echo "matrix=$(printf '%s\n' $changed | jq -R . | jq -cs '{include: map(select(length>0) | {env: .})}')" >> "$GITHUB_OUTPUT"
          echo "has_changes=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "clients with changes: ${changed:-none}"
          # One line that says what happens next (the apply job is skipped in two cases).
          if [ -z "$changed" ]; then
            echo "### No changes — nothing to apply (every planned client matches its file)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.apply }}" != "true" ]; then
            {
              echo "### Plan only — nothing was changed"
              echo "Clients with changes: $(echo $changed). Read their plans above, then run"
              echo "Provision again with **apply** ticked."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Applying: $(echo $changed)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Apply (only with apply: true): zone first, then delegation, then the rest.
  # No max-parallel: if the environments have reviewers, every client with
  # changes waits at once, so one "Review deployments" approval covers them all.
  apply:
    needs: changes
    if: inputs.apply && needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # includes up to 1h waiting on an outside registrar
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      CLIENT: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4 # the calling repo: clients/ + its workflows (dropdowns)
        with:
          sparse-checkout: |
            clients
            .github/workflows
      - uses: actions/checkout@v4 # the package, at the caller's pinned ref
        with:
          repository: derekadombek/website-deploy
          ref: ${{ inputs.package_ref }}
          path: pkg
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false # so the scripts can read `terraform output`
      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Read client file
        id: client
        run: |
          source infra/scripts/lib/client.sh
          echo "delegation_role=$(client_delegation_role_arn "$CLIENT")" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # delegate_from removed or changed since the last apply → the old parent
      # zone still holds this client's NS record (the state remembers where).
      - name: Find a stale delegation record
        id: stale
        run: |
          source infra/scripts/lib/client.sh
          stale="$(client_stale_delegation "$CLIENT")"
          read -r parent record <<<"$stale"
          if [ -n "$parent" ]; then
            echo "Stale NS record: $record in $parent's zone — removing it" | tee -a "$GITHUB_STEP_SUMMARY"
            { echo "parent=$parent"; echo "record=$record"; echo "role=$(client_parent_role_arn "$parent")"; } >> "$GITHUB_OUTPUT"
          fi
      - name: Switch to the old parent zone's delegation role
        if: steps.stale.outputs.parent != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.stale.outputs.role }}
          aws-region: us-east-1
      - name: Remove the stale NS record
        if: steps.stale.outputs.parent != ''
        env:
          PARENT: ${{ steps.stale.outputs.parent }}
          RECORD: ${{ steps.stale.outputs.record }}
        run: infra/scripts/delegate-ns.sh delete-record "$PARENT" "$RECORD"
      - name: Switch back to the client's role
        if: steps.stale.outputs.parent != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create DNS zone (if this client gets one)
        id: zone
        run: |
          infra/scripts/onboard-site.sh --phase create-zone "$CLIENT" | tee -a "$GITHUB_STEP_SUMMARY"
          ns=$(infra/scripts/tf.sh "$CLIENT" output -json hosted_zone_name_servers | jq -r '.[]' | tr '\n' ' ')
          echo "ns=$ns" >> "$GITHUB_OUTPUT"

      # Subdomain of another client's zone → write the NS record there.
      - name: Switch to the parent zone's delegation role
        if: steps.client.outputs.delegation_role != '' && steps.zone.outputs.ns != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.client.outputs.delegation_role }}
          aws-region: us-east-1
      - name: Add NS record in the parent zone
        if: steps.client.outputs.delegation_role != '' && steps.zone.outputs.ns != ''
        env:
          NS: ${{ steps.zone.outputs.ns }}
        run: infra/scripts/delegate-ns.sh upsert "$CLIENT" $NS
      - name: Switch back to the client's role
        if: steps.client.outputs.delegation_role != '' && steps.zone.outputs.ns != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Apply (waits for DNS delegation to go live first)
        run: infra/scripts/onboard-site.sh --phase finish "$CLIENT"

      # Health check: the domain answers over HTTPS (DNS, certificate, CDN all
      # work). Any HTTP status passes; a site that hasn't deployed yet answers 403.
      # Fails the run if it never answers, so a bad upgrade is caught here: roll
      # back by reverting the pin bump and running Provision with apply again.
      - name: Health check
        run: |
          source infra/scripts/lib/client.sh
          domain="$(client_get "$CLIENT" domain)"
          [ -n "$domain" ] || { echo "No domain — skipping the health check"; exit 0; }
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$domain/" || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "### $CLIENT — https://$domain answers ($code)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "https://$domain not answering yet (try $i/10)"; sleep 30
          done
          echo "::error::https://$domain did not answer over HTTPS after 5 minutes"
          echo "### $CLIENT — https://$domain does not answer over HTTPS" >> "$GITHUB_STEP_SUMMARY"
          exit 1
