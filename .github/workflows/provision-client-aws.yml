name: Provision Client's AWS Setup

# Provision/manage AWS clients (clients/<name>.yaml with provider: aws). Manual
# only: you dispatch it and name the client (or "all"), so you always explicitly
# choose what runs. A dispatch does validate → plan → (approve) → apply, so the
# plan is visible in the run and the environment approval is the control point
# before anything is applied.
#
# A client is CI-managed iff a GitHub Environment with its name exists (Set CI
# Environment creates it). That environment holds the client's AWS_TF_ROLE_ARN +
# AWS_REGION (scoped variables) and its own required reviewers — the approval is
# what mints the env-scoped OIDC token the client's Terraform role trusts.
# Validate-only clients (no environment) are still checked, just never applied.
#
# DNS is handled from the client file — one workflow for every case:
#   - no domain / existing zone / route53-registrar → straight apply.
#   - dns: external + delegate_from: <parent> → creates the zone, writes the NS
#     record into the parent client's zone (via its <parent>-dns-delegation
#     role), then applies. Hands-off.
#   - dns: external, domain at an outside registrar → creates the zone, prints
#     the 4 nameservers in the run summary, and WAITS (up to 1h) while you paste
#     them at the registrar; then applies. No second approval needed.
on:
  workflow_dispatch:
    inputs:
      client:
        description: Client name (clients/<name>.yaml), or "all".
        required: true
      confirm_fresh:
        description: First-ever provision of this ONE client (empty state)? Not allowed with "all".
        type: boolean
        default: false

permissions:
  id-token: write # OIDC token to assume the AWS role
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide which envs are in scope and emit the matrices.
  setup:
    runs-on: ubuntu-latest
    outputs:
      validate_matrix: ${{ steps.scope.outputs.validate_matrix }}
      apply_matrix: ${{ steps.scope.outputs.apply_matrix }}
      has_validate: ${{ steps.scope.outputs.has_validate }}
      has_apply: ${{ steps.scope.outputs.has_apply }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute target envs
        id: scope
        env:
          SELECTION: ${{ inputs.client }}
          CONFIRM_FRESH: ${{ inputs.confirm_fresh }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # confirm_fresh bypasses the empty-state guard — only ever for ONE named
          # client, never across "all".
          if [ "$CONFIRM_FRESH" = "true" ] && { [ -z "$SELECTION" ] || [ "$SELECTION" = "all" ]; }; then
            echo "::error::confirm_fresh only works with a single client name, not \"all\"."
            exit 1
          fi

          # All AWS clients (for validate).
          source infra/scripts/lib/client.sh
          all_envs=$(client_list aws)

          # CI-managed clients = those with a matching GitHub Environment (which
          # holds their AWS_TF_ROLE_ARN/AWS_REGION + reviewers). That's the
          # opt-in: create the environment to put a client under CI management.
          ci_envs=$(gh api "repos/${GITHUB_REPOSITORY}/environments" --paginate --jq '.environments[].name' 2>/dev/null || true)

          # In-scope env(s) from the dispatch input (one env, or "all").
          if [ -z "$SELECTION" ] || [ "$SELECTION" = "all" ]; then
            scope="$all_envs"
          elif echo "$all_envs" | grep -qx "$SELECTION"; then
            scope="$SELECTION"
          else
            echo "::error::No AWS client '$SELECTION' (clients/$SELECTION.yaml). Options: all, $(echo $all_envs | tr '\n' ' ')"
            exit 1
          fi

          j() { printf '%s\n' $1 | jq -R . | jq -cs 'map(select(length>0))'; }
          all_json=$(j "$all_envs"); scope_json=$(j "$scope"); ci_json=$(j "$ci_envs")

          # validate: every in-scope env. apply: in-scope envs that are CI-managed.
          validate=$(jq -cn --argjson a "$all_json" --argjson s "$scope_json" \
            '[ $a[] | select(. as $e | $s|index($e)) | {env: .} ]')
          apply=$(jq -cn --argjson a "$all_json" --argjson s "$scope_json" --argjson c "$ci_json" \
            '[ $a[] | select(. as $e | ($s|index($e)) and ($c|index($e))) | {env: .} ]')

          {
            echo "validate_matrix={\"include\":$validate}"
            echo "apply_matrix={\"include\":$apply}"
            echo "has_validate=$([ "$(echo "$validate" | jq 'length')" -gt 0 ] && echo true || echo false)"
            echo "has_apply=$([ "$(echo "$apply" | jq 'length')" -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          echo "scope: $(echo $scope | tr '\n' ' ')"
          echo "ci-managed: $(echo $ci_envs | tr '\n' ' ')"
          echo "validate: $validate"
          echo "apply: $apply"

  # Credential-free checks for the in-scope clients.
  validate:
    needs: setup
    if: needs.setup.outputs.has_validate == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.validate_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Check client file + validate
        run: |
          source infra/scripts/lib/client.sh
          client_tf_init "${{ matrix.env }}" -backend=false
          terraform validate

  # Plan for the in-scope CI-managed clients. Each runs in its own GitHub
  # Environment, whose approval mints the env-scoped OIDC token, and whose scoped
  # variables supply the role + region.
  plan:
    needs: [setup, validate]
    if: needs.setup.outputs.has_apply == 'true'
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.apply_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Plan
        run: infra/scripts/tf.sh "${{ matrix.env }}" plan -no-color -input=false

  # Apply after the plan + approval: zone first, then delegation, then the rest.
  apply:
    needs: [setup, validate, plan]
    if: needs.setup.outputs.has_apply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120 # includes up to 1h waiting on an outside registrar
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.apply_matrix) }}
    env:
      CLIENT: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # so the scripts can read `terraform output`
      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Read client file
        id: client
        run: |
          source infra/scripts/lib/client.sh
          echo "delegation_role=$(client_delegation_role_arn "$CLIENT")" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create DNS zone (if this client gets one)
        id: zone
        env:
          CONFIRM_FRESH: ${{ inputs.confirm_fresh }}
        run: |
          infra/scripts/onboard-site.sh --phase create-zone "$CLIENT" | tee -a "$GITHUB_STEP_SUMMARY"
          ns=$(infra/scripts/tf.sh "$CLIENT" output -json hosted_zone_name_servers | jq -r '.[]' | tr '\n' ' ')
          echo "ns=$ns" >> "$GITHUB_OUTPUT"

      # Subdomain of another client's zone → write the NS record there.
      - name: Switch to the parent zone's delegation role
        if: steps.client.outputs.delegation_role != '' && steps.zone.outputs.ns != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.client.outputs.delegation_role }}
          aws-region: us-east-1
      - name: Add NS record in the parent zone
        if: steps.client.outputs.delegation_role != '' && steps.zone.outputs.ns != ''
        env:
          NS: ${{ steps.zone.outputs.ns }}
        run: infra/scripts/delegate-ns.sh upsert "$CLIENT" $NS
      - name: Switch back to the client's role
        if: steps.client.outputs.delegation_role != '' && steps.zone.outputs.ns != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Apply (waits for DNS delegation to go live first)
        run: infra/scripts/onboard-site.sh --phase finish "$CLIENT"
